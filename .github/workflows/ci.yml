name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/v1.7-independent-evaluation, codex/v1.8-taint-tracking, codex/v1.9-research-hardening]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline test suite
        run: python -m unittest discover -s test -p "test_*.py" -v
      - name: Independent synthetic evaluation (limitations stay visible)
        id: evaluation
        continue-on-error: true
        run: python -m evaluation --seed 17 --repeat 2 --output-dir logs/evaluation
      - name: Evaluation summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path("logs/evaluation/report.json")
          if not report_path.exists():
              raise SystemExit("Independent evaluation did not produce evidence")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Independent evaluation (includes controls): " + str(report["summary"]) + "\n\n")
              summary.write("All FAILED and UNRUN cases remain in the artifact. Passing regression tests is not a safety claim.\n")
          expected_unrun = {(run, case_id) for run in (1, 2) for case_id in
                            ("audit_tamper_verification", "implicit_information_flow")}
          actual_unrun = {(result["run"], result["case_id"]) for result in report["results"]
                          if result["status"] == "UNRUN"}
          if report["summary"]["FAILED"] or actual_unrun != expected_unrun:
              raise SystemExit("Independent evaluation has failures or unexpected missing observations")
          PY
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-evaluation-python-${{ matrix.python-version }}
          path: logs/evaluation/
          retention-days: 7
      - name: V1.8 development ablation (baseline failures stay visible)
        continue-on-error: true
        run: python -m evaluation --experiment v1.8 --split development --seed 17 --repeat 3 --output-dir logs/v18-development
      - name: V1.8 compatibility evaluation (historical inputs unchanged)
        continue-on-error: true
        run: python -m evaluation --experiment v1.8 --split holdout --seed 17 --repeat 3 --output-dir logs/v18-holdout
      - name: V1.8 evidence gate
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from evaluation.experiment import load_dataset
          from security.inspection import DEFENSE_MODES
          for split in ("development", "holdout"):
              path = Path(f"logs/v18-{split}/report.json")
              if not path.exists():
                  raise SystemExit(f"Missing {split} experiment evidence")
              report = json.loads(path.read_text(encoding="utf-8"))
              dataset, digest = load_dataset(split)
              cases = {case["case_id"]: case for case in dataset["cases"]}
              expected = {(run, arm, name) for run in (1, 2, 3) for arm in DEFENSE_MODES for name in cases}
              actual = {(row["run"], row["arm"], row["case_id"]) for row in report["results"]}
              if actual != expected or len(actual) != len(report["results"]) or report["dataset_sha256"] != digest:
                  raise SystemExit("Changed/missing experiment cohort")
              for row in report["results"]:
                  case = cases[row["case_id"]]
                  if row["inputs"] != case or row["expected"] != case["expected"]:
                      raise SystemExit("Changed experiment contract")
                  if not case["supported"]:
                      if row["status"] != "UNRUN" or row["block_source"] != "unsupported" or row["defense_credit"]:
                          raise SystemExit("Unsupported flow received defense credit")
                  else:
                      if row["status"] == "UNRUN" or not row["actual"].get("valid_observation"):
                          raise SystemExit("Missing/invalid independent observations")
                      if row["arm"] == "scanner_taint" and row["status"] != "HELD":
                          raise SystemExit("Supported V1.8 regression")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write(f"V1.8 {split}: " + str({arm: metrics["summary"] for arm, metrics in report["metrics"].items()}) + "\n\n")
                  output.write("Other arms' FAILED and unsupported UNRUN remain visible; exploratory synthetic evidence only.\n")
          PY
      - name: Upload complete V1.8 synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v18-experiment-python-${{ matrix.python-version }}
          path: |
            logs/v18-development/
            logs/v18-holdout/
          retention-days: 7

  v19-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install optional plotting dependencies
        run: python -m pip install -r requirements-research.txt
      - name: V1.9 development (retain actual failures)
        continue-on-error: true
        run: python -m evaluation --experiment v1.9 --split development --seed 17 --repeat 3 --charts --output-dir logs/v19-development
      - name: V1.9 reserved compatibility run (not a new blind evaluation)
        continue-on-error: true
        run: python -m evaluation --experiment v1.9 --split reserved --seed 17 --repeat 3 --charts --output-dir logs/v19-reserved
      - name: Independently check contracts, receipts, audits, metrics and ablations
        if: always()
        run: python -m ci.validate_v19 logs/v19-development/report.json logs/v19-reserved/report.json
      - name: Verify live model calls stay disabled without explicit opt-in
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          execution = subprocess.run([sys.executable, '-m', 'evaluation.real_agent', '--provider', 'deepseek',
                                      '--model', 'deepseek-flash', '--output-dir', 'logs/v19-live-disabled'])
          if execution.returncode != 2:
              raise SystemExit('Expected UNRUN exit code 2')
          report = json.loads(Path('logs/v19-live-disabled/report.json').read_text())
          if report['summary'] != {'HELD': 0, 'FAILED': 0, 'UNRUN': 9}:
              raise SystemExit('Unexpected model observations')
          PY
      - name: Upload full evidence, including FAILED and UNRUN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v19-research-evidence
          path: |
            logs/v19-development/
            logs/v19-reserved/
            logs/v19-live-disabled/
          retention-days: 7

  research-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install optional plotting dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Render figures from committed actual-result summaries
        run: |
          python -m evaluation.plot docs/results/v1.8/development-summary.json --output-dir logs/research-figures/development
          python -m evaluation.plot docs/results/v1.8/holdout-summary.json --output-dir logs/research-figures/holdout
      - name: Upload research figures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v18-research-figures
          path: logs/research-figures/
          retention-days: 7

  v110-precision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install optional plotting dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Verify immutable historical evidence and reserved candidate
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          baseline = json.loads(Path('docs/results/v1.10/baseline-freeze.json').read_text())
          for group in ('preserved_files_sha256', 'source_sha256'):
              for name, digest in baseline[group].items():
                  if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                      raise SystemExit('Changed historical source/evidence: '+name)
          candidate = json.loads(Path('docs/results/v1.10/reserved-candidate.json').read_text())
          for name, digest in candidate['source_sha256'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Implementation changed after reserved candidate: '+name)
          print('Historical evidence and reserved implementation hashes verified')
          PY
      - name: New development comparisons (keep failures)
        continue-on-error: true
        run: python -m evaluation.precision_experiment --split development --seed 17 --repeat 3 --charts --output-dir logs/v110-development
      - name: Reserved compatibility (not a new blind trial)
        continue-on-error: true
        run: python -m evaluation.precision_experiment --split reserved --seed 17 --repeat 3 --charts --output-dir logs/v110-reserved
      - name: Independently validate contracts, arrivals, classification, metrics and cost
        if: always()
        run: |
          python -m ci.validate_v110 logs/v110-development/report.json
          python -m ci.validate_v110 logs/v110-reserved/report.json
      - name: Verify genuine model study is disabled and no paid calls occur
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          result = subprocess.run([sys.executable, '-m', 'evaluation.live_precision', '--output-dir', 'logs/v110-live-disabled'])
          report = json.loads(Path('logs/v110-live-disabled/report.json').read_text())
          if result.returncode != 2 or report['summary'] != {'HELD': 0, 'FAILED': 0, 'UNRUN': 36}:
              raise SystemExit('Unexpected live-model observations')
          if report['cost']['request_attempts'] != 0:
              raise SystemExit('Default invocation attempted model API')
          print('36 UNRUN, zero paid requests')
          PY
      - name: Upload complete synthetic evidence including all failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v110-precision-evidence
          path: |
            logs/v110-development/
            logs/v110-reserved/
            logs/v110-live-disabled/
          retention-days: 7
