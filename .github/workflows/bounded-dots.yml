name: Bounded Dots offline controls

on:
  push:
    branches: [codex/bounded-dots-transport]
  pull_request:
    branches: [codex/source-trust-methods]

permissions:
  contents: read

jobs:
  offline-transport:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Transport and existing guarded-loop offline controls
        run: python -m unittest discover -s test -p 'test_bounded_dots_client.py' -v
      - name: Verify frozen R3 files and existing R4 analytic artifacts
        run: python -m ci.validate_source_trust_feasibility
