name: Convergence review checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/research/source-trust/**'
      - '.github/workflows/convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  convergence:
    name: Convergence (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact committed bytes on Windows too
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned offline test dependency
        run: python -m pip install -r docs/research/source-trust/convergence/d5-calibration-v2/requirements.txt
      - name: CI log gate regression tests (outside the frozen 212-test suite)
        run: |
          mkdir -p logs/convergence
          python -I -m unittest discover -s docs/research/source-trust/ci -p 'test_*.py' -v 2>&1 | tee logs/convergence/log-gate-tests.log
      - name: D5 v2 engineering tests (not a calibration run or pilot)
        run: |
          python -I -X utf8 -m unittest discover -s docs/research/source-trust/convergence/d5-calibration-v2/tests -p 'test_*.py' -v 2>&1 | tee logs/convergence/d5-v2-tests.log
      - name: Prospective design metadata tests (no admission or pilot)
        run: |
          python -I -X utf8 -c "import unittest; s=unittest.defaultTestLoader.discover('docs/research/source-trust/convergence/prospective-design-v1/tests', pattern='test_*.py'); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not (r.wasSuccessful() and r.testsRun == 13 and len(r.skipped) == 0))" 2>&1 | tee logs/convergence/prospective-design-tests.log
          for packet in prospective-design-v1/proposal.json ledger-input-validation-v1/run-001/sampling-contract.json; do
            name=$(basename "$packet" .json)
            if python -I -X utf8 docs/research/source-trust/convergence/prospective-design-v1/design_binding.py --commit HEAD --packet "docs/research/source-trust/convergence/$packet" > "logs/convergence/design-$name.json"; then
              exit 1
            else
              result=$?
              test "$result" -eq 2
            fi
          done
          python -I -c "import json; from pathlib import Path; p=json.loads(Path('logs/convergence/design-proposal.json').read_text(encoding='utf-8')); h=json.loads(Path('logs/convergence/design-sampling-contract.json').read_text(encoding='utf-8')); assert p['state']=='PENDING_REAL_DESIGN_INPUTS' and h['state']=='REJECTED_POST_OUTCOME_DESIGN'; assert all(x['experiment_authorized'] is False and x['interval_selection_ready'] is False and x['formal_materials_admitted']==0 for x in (p,h))"
      - name: Full convergence suite (platform skips remain visible)
        run: |
          mkdir -p logs/convergence
          if python -u -m unittest discover -s docs/research/source-trust/convergence -p 'test_*.py' -v > logs/convergence/tests.log 2>&1; then
            result=0
          else
            result=$?
          fi
          tail -n 20 logs/convergence/tests.log
          exit "$result"
      - name: Enforce frozen test count and platform skip limits
        run: |
          python -I docs/research/source-trust/ci/check_convergence_log.py logs/convergence/tests.log --runner-os "${{ runner.os }}" | tee logs/convergence/test-counts.json
      - name: Original design and frozen-file checks
        run: python docs/research/source-trust/convergence/verify_convergence_design.py > logs/convergence/design.json
      - name: Commit-bound snapshot verification
        run: python docs/research/source-trust/convergence/evidence_snapshots.py > logs/convergence/snapshots.json
      - name: Provider gate remains blocked
        run: |
          if python docs/research/source-trust/convergence/pilot_readiness.py docs/research/source-trust/convergence/pilot-startup-v1/startup-check.json > logs/convergence/pilot.json; then
            echo 'Unexpected dispatchable pilot'
            exit 1
          else
            result=$?
            test "$result" -eq 2
          fi
      - name: Replay immutable historical archives at their measured commits
        if: runner.os == 'Linux'
        run: |
          git worktree add --detach "$RUNNER_TEMP/agentshield-v2" 3ebce7de93781fb5e3c742529c8a6f5be882f2ed
          python "$RUNNER_TEMP/agentshield-v2/docs/research/source-trust/convergence/run_development_v2.py" verify --root "$RUNNER_TEMP/agentshield-v2/docs/research/source-trust/convergence/development-v2/run-001" > logs/convergence/historical-v2.json
          git worktree add --detach "$RUNNER_TEMP/agentshield-v3" c57563d7a34c3bf6cdd2f5b48b85a5031143596c
          python "$RUNNER_TEMP/agentshield-v3/docs/research/source-trust/convergence/model_workflow_v3.py" verify --root "$RUNNER_TEMP/agentshield-v3/docs/research/source-trust/convergence/model-capture-v3/run-001" > logs/convergence/historical-v3.json
      - name: Upload logs including skips and blocked pilot state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: convergence-${{ matrix.os }}
          path: logs/convergence/
          retention-days: 14
